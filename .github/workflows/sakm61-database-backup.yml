name: SAKM-61 Encrypted Full Backup (best-effort)

on:
  workflow_dispatch:
  schedule:
    - cron: '45 20 * * *' # Daily at 02:45 Bangladesh time (UTC+6)

permissions:
  contents: read

concurrency:
  group: sakm-61-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export, encrypt and upload backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: https://lmwczibsipczfymhyqba.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "::error::SUPABASE_DB_URL is missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_KEY" || { echo "::error::BACKUP_ENCRYPTION_KEY is missing"; exit 1; }
          if [ "${#BACKUP_ENCRYPTION_KEY}" -lt 32 ]; then
            echo "::error::BACKUP_ENCRYPTION_KEY must contain at least 32 characters"
            exit 1
          fi

      - name: Validate database URL format (without printing credentials)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const raw = process.env.SUPABASE_DB_URL;
          let u;
          try {
            u = new URL(raw);
            if (!["postgres:", "postgresql:"].includes(u.protocol)) throw new Error("unsupported protocol");
            if (!u.hostname || !u.username || !u.password || !u.pathname || u.pathname === "/") throw new Error("missing URL component");
            const decodedUsername = decodeURIComponent(u.username);
            decodeURIComponent(u.password);
            if (u.hostname.endsWith(".pooler.supabase.com") && decodedUsername !== "postgres.lmwczibsipczfymhyqba") {
              console.error("::error::For the Supabase Session pooler, SUPABASE_DB_URL username must be postgres.lmwczibsipczfymhyqba. Copy the Session pooler URI from Supabase Connect and update the GitHub Actions secret.");
              process.exit(1);
            }
          } catch {
            console.error("::error::SUPABASE_DB_URL is not a valid PostgreSQL URI. In Supabase Connect, select Session pooler and URI format (not .NET). Percent-encode special characters in the password only. Do not include quotes or spaces.");
            process.exit(1);
          }
          console.log("Database URI format is valid; credentials were not printed.");
          NODE

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Dump database roles, schema, and data
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BACKUP_DIR="$RUNNER_TEMP/sakm61-backup"
          mkdir -p "$BACKUP_DIR/database"
          cd "$BACKUP_DIR/database"
          supabase db dump --remote="$SUPABASE_DB_URL" -f roles.sql --role-only
          supabase db dump --remote="$SUPABASE_DB_URL" -f schema.sql
          supabase db dump --remote="$SUPABASE_DB_URL" -f data.sql --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"
          test -s roles.sql
          test -s schema.sql
          test -s data.sql

      - name: Export Auth user metadata and Storage objects
        env:
          BACKUP_DIR: ${{ runner.temp }}/sakm61-backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BACKUP_DIR="$RUNNER_TEMP/sakm61-backup"
          cp scripts/backup-supabase-assets.mjs "$RUNNER_TEMP/backup-supabase-assets.mjs"
          cd "$RUNNER_TEMP"
          npm install --no-save --no-package-lock @supabase/supabase-js@2.49.1
          node "$RUNNER_TEMP/backup-supabase-assets.mjs"
          mkdir -p "$BACKUP_DIR/edge-functions"
          if [ -d "$GITHUB_WORKSPACE/supabase/functions" ]; then cp -R "$GITHUB_WORKSPACE/supabase/functions/." "$BACKUP_DIR/edge-functions/"; fi
          cat > "$BACKUP_DIR/BACKUP-SCOPE.txt" <<'EOF'
          Included:
          - PostgreSQL roles, public schema and data from Supabase CLI dump.
          - Auth user profile/metadata and provider identity metadata (not password hashes, sessions, refresh tokens, MFA secrets, or provider credentials).
          - Storage bucket settings and object bytes accessible through the Storage API.
          - Edge Function source files committed in this repository at the workflow's checked-out commit.
          Not included / restore caveats:
          - Supabase-managed Auth/Storage schemas and internal service state.
          - Password hashes and active sessions; users may need password resets or re-invitations.
          - Edge Function deployed secrets, project secrets, Auth provider secrets, SMTP settings, API keys, JWT signing secrets, and dashboard-only project settings.
          - Remote Edge Function code not committed to this repository.
          - A verified end-to-end restore into a fresh Supabase project.
          This artifact is a best-effort recovery bundle, not a guaranteed one-click full-project clone.
          EOF

      - name: Create archive and encrypt it
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BACKUP_DIR="$RUNNER_TEMP/sakm61-backup"
          tar -czf "$RUNNER_TEMP/SAKM-61-backup.tar.gz" -C "$RUNNER_TEMP" sakm61-backup
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -in "$RUNNER_TEMP/SAKM-61-backup.tar.gz" \
            -out "$RUNNER_TEMP/SAKM-61-backup.tar.gz.enc" \
            -pass env:BACKUP_ENCRYPTION_KEY
          test -s "$RUNNER_TEMP/SAKM-61-backup.tar.gz.enc"
          # Verify the encrypted archive can be decrypted and its required payload is present.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$RUNNER_TEMP/SAKM-61-backup.tar.gz.enc" \
            -out "$RUNNER_TEMP/SAKM-61-backup-verify.tar.gz" \
            -pass env:BACKUP_ENCRYPTION_KEY
          tar -tzf "$RUNNER_TEMP/SAKM-61-backup-verify.tar.gz" > "$RUNNER_TEMP/SAKM-61-backup-files.txt"
          grep -q 'sakm61-backup/database/roles.sql' "$RUNNER_TEMP/SAKM-61-backup-files.txt"
          grep -q 'sakm61-backup/database/schema.sql' "$RUNNER_TEMP/SAKM-61-backup-files.txt"
          grep -q 'sakm61-backup/database/data.sql' "$RUNNER_TEMP/SAKM-61-backup-files.txt"
          grep -q 'sakm61-backup/BACKUP-SCOPE.txt' "$RUNNER_TEMP/SAKM-61-backup-files.txt"
          cd "$RUNNER_TEMP"
          sha256sum SAKM-61-backup.tar.gz.enc > SAKM-61-backup.tar.gz.enc.sha256
          rm -rf "$BACKUP_DIR" "$RUNNER_TEMP/node_modules" "$RUNNER_TEMP/backup-supabase-assets.mjs" "$RUNNER_TEMP/SAKM-61-backup.tar.gz" "$RUNNER_TEMP/SAKM-61-backup-verify.tar.gz" "$RUNNER_TEMP/SAKM-61-backup-files.txt"

      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SAKM-61-encrypted-backup
          path: |
            ${{ runner.temp }}/SAKM-61-backup.tar.gz.enc
            ${{ runner.temp }}/SAKM-61-backup.tar.gz.enc.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/sakm61-backup" "$RUNNER_TEMP/node_modules"
          rm -f "$RUNNER_TEMP/backup-supabase-assets.mjs" "$RUNNER_TEMP/SAKM-61-backup.tar.gz" "$RUNNER_TEMP/SAKM-61-backup.tar.gz.enc" "$RUNNER_TEMP/SAKM-61-backup.tar.gz.enc.sha256" "$RUNNER_TEMP/SAKM-61-backup-verify.tar.gz" "$RUNNER_TEMP/SAKM-61-backup-files.txt"
