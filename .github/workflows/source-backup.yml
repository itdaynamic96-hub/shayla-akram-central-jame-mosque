name: Package SAKM-61 source backup
on:
  workflow_dispatch:
  push:
    branches: ["feature/monthly-contributions-20261124"]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create complete source ZIP
        run: git archive --format=zip --output=SAKM-61-full-source-backup.zip HEAD
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAKM-61-full-source-backup
          path: SAKM-61-full-source-backup.zip
          if-no-files-found: error
          retention-days: 30
