name: Validate and deploy static site to GitHub Pages
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-{0}', github.ref) }}
  cancel-in-progress: true
jobs:

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python and Node
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned browser TTS build dependencies
        run: npm install --no-audit --no-fund
      - name: Build local Svara browser TTS
        run: npm run build:tts
      - name: Validate site files and inline scripts
        run: python tests/validate_site.py
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned browser TTS build dependencies
        run: npm install --no-audit --no-fund
      - name: Build local Svara browser TTS
        run: npm run build:tts
      - name: Remove build-only dependencies from the Pages artifact
        run: rm -rf node_modules package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          name: nexora-mosque-site
      - name: Wait for Pages artifact registration
        run: sleep 10
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: nexora-mosque-site
