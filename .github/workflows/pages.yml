name: Validate and deploy static site to GitHub Pages
on:
  push:
    branches: ["main", "admin-panel-repair-20261122", "admin-dashboard-upgrade-20261122", "accounts-messaging-integration-20261125", "accounts-double-entry-20261125", "accounts-finalization-v2-20261125"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python and Node
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate site files and inline scripts
        run: python tests/validate_site.py
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          name: nexora-mosque-site
      - name: Wait for Pages artifact registration
        run: sleep 10
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: nexora-mosque-site
